<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalina Roldan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D3C4DE; --fg:#2E1633; --s:1; --wt:400; --ls:0em; --lh:1.4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{background:var(--bg);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:"Neue Haas Unica","Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;overflow:hidden;
}
.wrap{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:64rem;margin:0 auto;padding:1.25rem 1.5rem 0}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.name{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin:0}
.right{display:flex;align-items:center;gap:1rem;font-size:1rem}
.li{
  display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;
  background:var(--fg);color:var(--bg);transition:transform .15s;
}
.li:hover{transform:scale(1.1)}
.li svg{width:1.3rem;height:1.3rem;fill:currentColor}
a:focus-visible,input:focus-visible{outline:3px solid currentColor;outline-offset:4px}

.ticker{overflow:hidden;white-space:nowrap;background:var(--fg);color:var(--bg);margin:1.25rem -1.5rem 0;max-height:0;opacity:0;transition:max-height .35s,opacity .35s}
.ticker.on{max-height:3rem;opacity:1}
.ticker span{display:inline-block;padding:.5rem 0;font-weight:800;animation:slide 40s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}

.layout{
  flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 18rem;grid-template-rows:minmax(0,1fr);
  gap:1rem 3rem;padding:clamp(.75rem,5vh,3.5rem) 0 1rem;
}
.cell{min-height:0;overflow:hidden}
.copy{
  margin:0;font-size:var(--size,1.4rem);
  font-weight:var(--wt);letter-spacing:var(--ls);line-height:var(--lh);
  transition:opacity .15s;
}
.copy.swap{opacity:0}

/* stickers live in their own column, so they never cover the text */
.zone{display:flex;flex-wrap:wrap;gap:.8rem;align-content:flex-start;align-self:start;max-height:100%;overflow:hidden;padding:.4rem}
.s{
  margin-left:var(--ml);opacity:0;transform:scale(0) rotate(var(--r));
  transition:transform .4s cubic-bezier(.2,1.7,.4,1),opacity .12s;
}
.s.on{opacity:1;transform:scale(1) rotate(var(--r))}
.s span{
  display:grid;place-items:center;text-align:center;padding:.6rem 1.1rem;
  font-weight:800;font-size:clamp(1rem,2.2vw,1.4rem);line-height:1;letter-spacing:-.02em;
  background:var(--c);color:var(--k);animation:wob 1.6s ease-in-out infinite alternate;
}
.pill span{border-radius:999px}
.box span{border-radius:.4rem}
.burst span{
  width:clamp(6.5rem,15vh,8rem);height:clamp(6.5rem,15vh,8rem);padding:.6rem;font-size:clamp(.8rem,1.7vh,1rem);
  clip-path:polygon(50% 0,61% 15%,79% 9%,82% 28%,100% 35%,88% 50%,100% 65%,82% 72%,79% 91%,61% 85%,50% 100%,39% 85%,21% 91%,18% 72%,0 65%,12% 50%,0 35%,18% 28%,21% 9%,39% 15%);
}
@keyframes wob{to{transform:rotate(5deg) scale(1.05)}}

/* effects layer: sits behind the text, never on top of it */
.fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.m{position:absolute;top:-3rem;left:var(--l);font-size:var(--fs);line-height:1;animation:rain var(--d) linear forwards;will-change:transform}
@keyframes rain{to{transform:translate(var(--sx),calc(100vh + 6rem)) rotate(var(--rot))}}
.p{position:absolute;left:50%;top:45%;width:14px;height:14px;animation:fly .95s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(.4);opacity:0}}

.bar{
  position:relative;z-index:8;flex:none;background:var(--fg);color:var(--bg);
  padding:.6rem 1.5rem .6rem;
}
.bar-in{max-width:64rem;margin:0 auto}
.labels{display:flex;justify-content:space-between;gap:1rem;font-weight:700;font-size:1rem;margin-bottom:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2rem;background:transparent;margin:0;cursor:grab}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:var(--bg)}
input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:var(--bg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-12px;border-radius:50%;background:var(--bg);border:0}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--bg);border:0}
.clients{margin-top:.2rem;padding-top:.5rem;border-top:1px solid currentColor}
.clients h2{margin:0 0 .4rem;font-size:.8rem;font-weight:700;text-align:center}
/* every logo gets the same height: widths are proportional to each logo's aspect ratio */
.clients ul{list-style:none;margin:0 auto;padding:0;display:flex;align-items:center;gap:clamp(.5rem,2vw,1.6rem);width:min(100%,52rem)}
.clients li{flex-grow:var(--ar);flex-shrink:1;flex-basis:0;min-width:0}
.logo{display:block;width:100%;aspect-ratio:var(--ar);background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.credit{margin:.45rem 0 0;font-size:.6rem;text-align:center;opacity:.85}
.credit a{color:inherit;text-underline-offset:.2em}
@media (max-width:56rem){
  .layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .s{margin-left:0}
  .s span{padding:.4rem .8rem;font-size:.95rem}
  .zone{gap:.5rem}
}
@media (prefers-reduced-motion:reduce){.s span,.ticker span{animation:none}}
</style>
</head>

  <div class="ticker" id="ticker" aria-hidden="true"><span id="tk"></span></div>

  <main class="layout">
    <div class="cell" id="cell"><p class="copy" id="copy" aria-live="polite"></p></div>
    <div class="zone" id="zone" aria-hidden="true"></div>

</div>

<div class="bar">

  </div>
</div>

  `<div class="s ${s.shape}" style="--ml:${s.ml};--r:${s.r}deg;--c:${s.c};--k:${s.k}"><span></span></div>`).join("");
const els = [...document.querySelectorAll(".s")];
els.forEach((el, i) => el.querySelector("span").textContent = CONFIG.stickers[i].t);

document.querySelectorAll("#clients li").forEach((li, i) => {
  const c = CONFIG.clients[i];
  li.style.setProperty("--ar", c.ar || 3);
  if (c.logo){
    li.innerHTML = '<span class="logo" role="img"></span>';
    const s = li.firstChild; s.setAttribute("aria-label", c.name);
    s.style.webkitMaskImage = s.style.maskImage = 'url("' + c.logo + '")';
  } else li.textContent = c.name;
});

const LIGHT = [246,233,240], DARK = [46,22,51];
const bgStops = [
  { v: 0,   c: [227,220,234] }, { v: 50, c: [211,196,222] }, { v: 68, c: [183,122,155] },
  { v: 84,  c: [158,58,79] },   { v: 100, c: [74,31,61] }
];
const lerp = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
const rgb = c => `rgb(${c.join(",")})`;
const lum = c => { const f = x => { x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); };
  return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const pick = (v, pts) => { for (let i = 1; i < pts.length; i++) if (v <= pts[i][0]) {
  const [v0, a] = pts[i - 1], [v1, b] = pts[i]; return a + (b - a) * (v - v0) / (v1 - v0); } return pts[pts.length - 1][1]; };
const stageOf = v => v <= 15 ? 0 : v <= 30 ? 1 : v <= 46 ? 2 : v <= 52 ? 3 : v <= 68 ? 4 : v <= 84 ? 5 : 6;
const rnd = (a, b) => a + Math.random() * (b - a);
function bgAt(v){
  for (let i = 1; i < bgStops.length; i++) if (v <= bgStops[i].v) {
    const a = bgStops[i - 1], b = bgStops[i]; return lerp(a.c, b.c, (v - a.v) / (b.v - a.v)); }
  return bgStops[bgStops.length - 1].c;
}

/* ---- hard-sell effects ---- */
function boom(){
  const cols = ["#F6E9F0","#D9709A","#B79ACB","#C2577A","#FFD36B"];
  for (let i = 0; i < 80; i++){
    const p = document.createElement("span"), a = Math.random() * Math.PI * 2;
    const d = 100 + Math.random() * Math.min(innerWidth, 900) * .5, z = 8 + Math.random() * 12;
    p.className = "p"; p.style.width = p.style.height = z + "px";
    p.style.background = cols[i % cols.length]; p.style.borderRadius = i % 3 ? "2px" : "50%";
    p.style.setProperty("--dx", Math.cos(a) * d + "px"); p.style.setProperty("--dy", Math.sin(a) * d * .8 + "px");
    fx.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}
let live = 0;
function drop(){
  if (live > 90) return;
  const m = document.createElement("span");
  m.className = "m"; m.textContent = Math.random() < .8 ? "💵" : "💸";
  m.style.setProperty("--l", rnd(0, 96) + "%");
  m.style.setProperty("--fs", rnd(1.6, 3.2) + "rem");
  m.style.setProperty("--d", rnd(3, 6) + "s");
  m.style.setProperty("--sx", rnd(-90, 90) + "px");
  m.style.setProperty("--rot", rnd(-300, 300) + "deg");
  fx.appendChild(m); live++;
  m.addEventListener("animationend", () => { m.remove(); live--; });
}
let cur = 50;
setInterval(() => {
  if (reduce || cur < 85) return;
  const n = cur >= 97 ? 3 : cur >= 91 ? 2 : 1;
  for (let i = 0; i < n; i++) drop();
}, 130);

let stage = -1, boomed = false, scale = 1;
/* shrink the paragraph just enough that everything fits on screen with no scrolling */
function fitCopy(){
  const cell = $("cell"), p = $("copy");
  let size = Math.min(Math.max(19.2, innerWidth * .026), 28.8) * scale;
  p.style.setProperty("--size", size + "px");
  const max = cell.clientHeight; let n = 0;
  while (p.offsetHeight > max && size > 12 && n++ < 80){ size *= .96; p.style.setProperty("--size", size + "px"); }
}
function setCopy(s){ $("copy").textContent = CONFIG.copy[s]; fitCopy(); }
function update(){
  const v = +$("vol").value, r = document.documentElement.style;
  cur = v;
  const bg = bgAt(v);
  let fg = contrast(DARK, bg) >= contrast(LIGHT, bg) ? DARK : LIGHT;
  if (v < 50) fg = lerp(fg, bg, (50 - v) / 50 * .2);   /* quieter text on the soft side */
  r.setProperty("--bg", rgb(bg)); r.setProperty("--fg", rgb(fg));
  scale = pick(v, [[0, .92], [50, 1], [100, 1.35]]);
  r.setProperty("--wt", Math.round(pick(v, [[0, 300], [50, 400], [100, 800]])));
  r.setProperty("--ls", pick(v, [[0, 0], [50, 0], [100, -.025]]).toFixed(3) + "em");
  r.setProperty("--lh", pick(v, [[0, 1.45], [50, 1.4], [100, 1.15]]).toFixed(3));
  CONFIG.stickers.forEach((s, i) => els[i].classList.toggle("on", v >= s.thr));
  $("ticker").classList.toggle("on", v >= 78);
  fitCopy();
  if (v < 85){ fx.querySelectorAll(".m").forEach(e => e.remove()); live = 0; }
  const s = stageOf(v);
  if (s !== stage){
    const first = stage === -1; stage = s;
    if (first) setCopy(s);
    else { $("copy").classList.add("swap"); setTimeout(() => { setCopy(s); $("copy").classList.remove("swap"); }, 150); }
  }
  if (v >= 97 && !boomed){ boomed = true; if (!reduce) boom(); }
  if (v < 90) boomed = false;
}
$("vol").addEventListener("input", update);
update();
addEventListener("resize", fitCopy);
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitCopy)).observe($("cell"));
if (document.fonts) document.fonts.ready.then(fitCopy);
</script>
</body>
</html>
